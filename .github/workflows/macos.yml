name: macOS build and tests

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: |
          sw_vers
          xcodebuild -version
      - name: Build and package screen saver
        run: ./scripts/package.sh
      - name: Run hosted tests
        env:
          TEST_RUNNER_DESIGN_PREVIEW_DIR: ${{ github.workspace }}/build/design-previews
        run: >-
          xcodebuild -project SwitchBotScreenSaver.xcodeproj
          -scheme SwitchBotSaverPreview -configuration Debug
          -destination 'platform=macOS' -parallel-testing-enabled NO
          -derivedDataPath DerivedData -resultBundlePath build/ScreenSaverTests.xcresult test
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScreenSaverTests-results-${{ matrix.os }}
          path: build/ScreenSaverTests.xcresult
          if-no-files-found: ignore
      - name: Save installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SwitchBotScreenSaver-${{ matrix.os }}
          path: build/SwitchBotScreenSaver-macos.zip
          if-no-files-found: error
      - name: Save design previews
        uses: actions/upload-artifact@v4
        with:
          name: DesignPreviews-${{ matrix.os }}
          path: build/design-previews
          if-no-files-found: error
