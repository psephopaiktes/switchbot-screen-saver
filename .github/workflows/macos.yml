name: macOS build and tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build screen saver bundle
        run: >-
          xcodebuild -project SwitchBotScreenSaver.xcodeproj
          -scheme SwitchBotScreenSaver -configuration Release
          -derivedDataPath DerivedData build
      - name: Run hosted tests
        run: >-
          xcodebuild -project SwitchBotScreenSaver.xcodeproj
          -scheme SwitchBotSaverPreview -configuration Debug
          -destination 'platform=macOS' -parallel-testing-enabled NO
          -derivedDataPath DerivedData -resultBundlePath build/ScreenSaverTests.xcresult test
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ScreenSaverTests-results
          path: build/ScreenSaverTests.xcresult
          if-no-files-found: ignore
