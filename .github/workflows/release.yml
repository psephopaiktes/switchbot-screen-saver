name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, plistlib, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('Use a stable version tag such as v0.3.1.')
          info = plistlib.loads(Path('Resources/ScreenSaver-Info.plist').read_bytes())
          if info['CFBundleShortVersionString'] != tag[1:]:
              raise SystemExit('The tag must match CFBundleShortVersionString.')
          print('Release version matches the bundle.')
          PY

  build:
    needs: validate
    uses: ./.github/workflows/macos.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SwitchBotScreenSaver-macos-15
          path: build
      - name: Verify archive and prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, plistlib, zipfile
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          repo = os.environ['RELEASE_REPOSITORY']
          with zipfile.ZipFile('build/SwitchBotScreenSaver-macos.zip') as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Archive integrity check failed.')
              info_path = next(name for name in archive.namelist()
                               if name.endswith('.saver/Contents/Info.plist')
                               and not name.startswith('__MACOSX/'))
              info = plistlib.loads(archive.read(info_path))
              if info['CFBundleShortVersionString'] != tag[1:]:
                  raise SystemExit('Archive version does not match the tag.')
              if not any(name.endswith('/Getting Started.md') for name in archive.namelist()):
                  raise SystemExit('English installation guide is missing.')
          notes = (
              'Download **SwitchBotScreenSaver-macos.zip** below, extract it, and open the `.saver`.\n\n'
              'This free download is not notarized by Apple. If blocked, allow this screen saver in '
              '**System Settings → Privacy & Security → Open Anyway**, then reopen System Settings.\n\n'
              f'[English instructions](https://github.com/{repo}/blob/{tag}/README.md) | '
              f'[日本語の手順](https://github.com/{repo}/blob/{tag}/README.ja.md)\n'
          )
          Path('release-notes.md').write_text(notes)
          PY
      - name: Attach ZIP and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-is-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/release-is-draft")" != "true" ]]; then
              echo 'This release is already published; its assets will not be replaced.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" build/SwitchBotScreenSaver-macos.zip --clobber
          gh release edit "$RELEASE_TAG" --draft=false --notes-file release-notes.md
