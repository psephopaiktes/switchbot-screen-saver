name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, plistlib, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('Use a stable version tag such as v0.3.1.')
          info = plistlib.loads(Path('Resources/ScreenSaver-Info.plist').read_bytes())
          if info['CFBundleShortVersionString'] != tag[1:]:
              raise SystemExit('The tag must match CFBundleShortVersionString.')
          print('Release version matches the bundle.')
          PY

  build:
    needs: validate
    uses: ./.github/workflows/macos.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SwitchBotScreenSaver-macos-15
          path: build
      - uses: actions/checkout@v4
      - name: Verify archive and generate cask
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/update-cask.py --version "${RELEASE_TAG#v}" \
            --archive build/SwitchBotScreenSaver-macos.tar.gz \
            --repository "$RELEASE_REPOSITORY" --output build/switchbot-screen-saver.rb
          python3 - <<'PY'
          import os
          from pathlib import Path
          repo = os.environ['RELEASE_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          Path('release-notes.md').write_text(
              'Install with Homebrew:\n\n```sh\n'
              f'brew tap psephopaiktes/switchbot-screen-saver https://github.com/{repo}\n'
              'brew install --cask psephopaiktes/switchbot-screen-saver/switchbot-screen-saver\n```\n\n'
              'For updates, run `brew update` then '
              '`brew upgrade --cask psephopaiktes/switchbot-screen-saver/switchbot-screen-saver`.\n\n'
              'This screen saver is not notarized by Apple. If blocked, allow it in '
              '**System Settings → Privacy & Security → Open Anyway** and reopen System Settings.\n\n'
              f'[English](https://github.com/{repo}/blob/{tag}/README.md) | '
              f'[日本語](https://github.com/{repo}/blob/{tag}/README.ja.md)\n'
          )
          PY
      - name: Publish Homebrew archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-is-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/release-is-draft")" != "true" ]]; then
              echo 'This release is already published; its assets will not be replaced.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" build/SwitchBotScreenSaver-macos.tar.gz --clobber
          gh release edit "$RELEASE_TAG" --draft=false --notes-file release-notes.md
      - name: Update Homebrew cask on main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish-cask.py build/switchbot-screen-saver.rb
